[versions]
agp = "8.13.2"
kotlin = "2.0.21"
compose-multiplatform = "1.7.3"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.13.0"
